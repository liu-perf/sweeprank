[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sweeprank"
version = "0.1.0"
description = "A tuning sweep's winner, and the number somebody was watching -- every metric declares whether it may select, and a stand-in has to earn it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "liu-perf" }]
keywords = ["gpu", "benchmarking", "profiling", "utilization", "scaling", "ddp",
            "methodology", "proxy-metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
# Zero runtime dependencies. Everything in data/ is already measured; re-deriving
# the conclusions is arithmetic over committed JSON and needs no GPU, no torch
# and no network.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/liu-perf/sweeprank"
Documentation = "https://liu-perf.github.io/sweeprank/"

[project.scripts]
sweeprank = "sweeprank.cli:main"

[tool.setuptools]
packages = ["sweeprank"]

[tool.setuptools.package-data]
sweeprank = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Same set as the other fifteen repositories in this series.
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
